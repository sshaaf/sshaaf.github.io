<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" role="img" aria-labelledby="title desc">
  <title id="title">Community detection: finding architectural subsystems</title>
  <desc id="desc">Label-propagation clusters tightly-coupled functions into communities that approximate microservice boundaries</desc>
  <defs>
    <style>
      .heading { font: 600 16px ui-sans-serif, system-ui, sans-serif; fill: #0f766e; }
      .label { font: 13px ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .node-label { font: 600 10px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1e293b; }
      .community-label { font: 600 14px ui-sans-serif, system-ui, sans-serif; }
      .note { font: italic 11px ui-sans-serif, system-ui, sans-serif; fill: #64748b; }
      .c1-node { fill: #dbeafe; stroke: #3b82f6; stroke-width: 2; }
      .c2-node { fill: #d1fae5; stroke: #10b981; stroke-width: 2; }
      .c3-node { fill: #fce7f3; stroke: #ec4899; stroke-width: 2; }
      .c1-zone { fill: #eff6ff; stroke: #93c5fd; stroke-width: 2; stroke-dasharray: 6 3; }
      .c2-zone { fill: #ecfdf5; stroke: #6ee7b7; stroke-width: 2; stroke-dasharray: 6 3; }
      .c3-zone { fill: #fdf2f8; stroke: #f9a8d4; stroke-width: 2; stroke-dasharray: 6 3; }
      .intra-edge { stroke: #94a3b8; stroke-width: 1.5; fill: none; }
      .cross-edge { stroke: #f59e0b; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; marker-end: url(#cross); }
      .arrow-right { font: 600 24px ui-sans-serif, system-ui, sans-serif; fill: #64748b; }
    </style>
    <marker id="cross" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#f59e0b"/>
    </marker>
  </defs>

  <text class="heading" x="48" y="36">Community detection: structural microservice boundaries</text>
  <text class="label" x="48" y="56">Label propagation groups tightly-coupled functions; loose cross-community edges suggest service cuts</text>

  <!-- BEFORE: tangled graph -->
  <text class="community-label" x="80" y="90" fill="#475569">Before: tangled monolith</text>

  <rect x="48" y="100" width="340" height="300" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>

  <!-- All nodes in gray -->
  <circle cx="120" cy="160" r="22" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text class="node-label" x="96" y="164">orderSvc</text>

  <circle cx="240" cy="140" r="22" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text class="node-label" x="220" y="144">cartSvc</text>

  <circle cx="320" cy="200" r="22" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text class="node-label" x="296" y="204">itemDAO</text>

  <circle cx="120" cy="260" r="22" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text class="node-label" x="96" y="264">paySvc</text>

  <circle cx="240" cy="290" r="22" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text class="node-label" x="212" y="294">shipSvc</text>

  <circle cx="320" cy="330" r="22" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text class="node-label" x="300" y="334">notify</text>

  <circle cx="180" cy="350" r="22" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text class="node-label" x="160" y="354">emailSvc</text>

  <circle cx="100" cy="340" r="22" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text class="node-label" x="82" y="344">log</text>

  <!-- Tangled edges -->
  <line class="intra-edge" x1="142" y1="160" x2="218" y2="140"/>
  <line class="intra-edge" x1="262" y1="140" x2="298" y2="200"/>
  <line class="intra-edge" x1="120" y1="182" x2="120" y2="238"/>
  <line class="intra-edge" x1="142" y1="260" x2="218" y2="290"/>
  <line class="intra-edge" x1="262" y1="290" x2="298" y2="330"/>
  <line class="intra-edge" x1="240" y1="162" x2="240" y2="268"/>
  <line class="intra-edge" x1="138" y1="168" x2="300" y2="324"/>
  <line class="intra-edge" x1="202" y1="350" x2="298" y2="334"/>
  <line class="intra-edge" x1="120" y1="340" x2="158" y2="348"/>

  <!-- Arrow -->
  <text class="arrow-right" x="400" y="270">&#x27A1;</text>
  <text class="note" x="396" y="290">label</text>
  <text class="note" x="388" y="304">propagation</text>

  <!-- AFTER: clustered communities -->
  <text class="community-label" x="500" y="90" fill="#475569">After: detected communities</text>

  <!-- Community 1: Order/Cart (blue) -->
  <rect class="c1-zone" x="468" y="100" width="192" height="140" rx="16"/>
  <text class="community-label" x="496" y="124" fill="#2563eb">Order &amp; Cart</text>

  <circle class="c1-node" cx="520" cy="170" r="20"/>
  <text class="node-label" x="496" y="174">orderSvc</text>

  <circle class="c1-node" cx="610" cy="150" r="20"/>
  <text class="node-label" x="590" y="154">cartSvc</text>

  <circle class="c1-node" cx="610" cy="210" r="20"/>
  <text class="node-label" x="586" y="214">itemDAO</text>

  <line class="intra-edge" x1="540" y1="170" x2="590" y2="150" stroke="#3b82f6"/>
  <line class="intra-edge" x1="610" y1="170" x2="610" y2="190" stroke="#3b82f6"/>

  <!-- Community 2: Payment/Shipping (green) -->
  <rect class="c2-zone" x="468" y="252" width="192" height="120" rx="16"/>
  <text class="community-label" x="488" y="276" fill="#059669">Payment &amp; Shipping</text>

  <circle class="c2-node" cx="520" cy="320" r="20"/>
  <text class="node-label" x="500" y="324">paySvc</text>

  <circle class="c2-node" cx="620" cy="320" r="20"/>
  <text class="node-label" x="596" y="324">shipSvc</text>

  <line class="intra-edge" x1="540" y1="320" x2="600" y2="320" stroke="#10b981"/>

  <!-- Community 3: Notifications (pink) -->
  <rect class="c3-zone" x="688" y="252" width="140" height="150" rx="16"/>
  <text class="community-label" x="704" y="276" fill="#db2777">Notifications</text>

  <circle class="c3-node" cx="758" cy="310" r="20"/>
  <text class="node-label" x="740" y="314">notify</text>

  <circle class="c3-node" cx="758" cy="370" r="20"/>
  <text class="node-label" x="734" y="374">emailSvc</text>

  <circle class="c3-node" cx="718" cy="370" r="20"/>
  <text class="node-label" x="706" y="374">log</text>

  <line class="intra-edge" x1="758" y1="330" x2="758" y2="350" stroke="#ec4899"/>
  <line class="intra-edge" x1="738" y1="370" x2="720" y2="370" stroke="#ec4899"/>

  <!-- Cross-community edges (few, weak) -->
  <path class="cross-edge" d="M 520 190 Q 500 260 520 300"/>
  <path class="cross-edge" d="M 640 320 Q 670 316 738 310"/>
  <path class="cross-edge" d="M 610 230 Q 680 260 738 290"/>

  <!-- Summary -->
  <rect x="468" y="414" width="360" height="22" rx="4" fill="#fef3c7" stroke="#fbbf24" stroke-width="1"/>
  <text class="note" x="488" y="430" fill="#92400e">Dashed yellow = weak cross-community coupling = cut here</text>
</svg>
