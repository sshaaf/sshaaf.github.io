<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" role="img" aria-labelledby="title desc">
  <title id="title">Tightening policies over time</title>
  <desc id="desc">CoolStore violations at each threshold -- lower limits surface more functions</desc>
  <defs>
    <style>
      .heading { font: 600 16px ui-sans-serif, system-ui, sans-serif; fill: #0f766e; }
      .label   { font: 13px ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .node-label { font: 600 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1e293b; }
      .thresh  { font: 700 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1e293b; }
      .bar-text { font: 600 12px ui-sans-serif, system-ui, sans-serif; fill: #374151; }
      .annot   { font: 12px ui-sans-serif, system-ui, sans-serif; fill: #64748b; }
      .axis-label { font: 11px ui-sans-serif, system-ui, sans-serif; fill: #94a3b8; }
      .arrow-label { font: 600 11px ui-sans-serif, system-ui, sans-serif; fill: #0f766e; }
    </style>
    <marker id="arr-down" markerWidth="8" markerHeight="7" refX="4" refY="6" orient="auto">
      <polygon points="0 0, 8 0, 4 7" fill="#0f766e"/>
    </marker>
  </defs>

  <!-- Title block -->
  <text class="heading" x="48" y="38">Tightening policies over time</text>
  <text class="label"   x="48" y="58">CoolStore violations at each threshold -- lower limits surface more functions</text>

  <!-- ── Layout constants ──────────────────────────────────────────
       Left margin (threshold labels): 48
       Bar origin X: 182
       Max bar width: 480  (maps to 147 violations)
       Bar height: 42   Gap between bars: 22
       Row 1 top Y: 90  Row 2: 154  Row 3: 218  Row 4: 282
       Annotation X: bar_origin + max_bar_width + 16 = 678
  ──────────────────────────────────────────────────────────────── -->

  <!-- ── Tighter-policy arrow (left side) ─────────────────────── -->
  <line x1="28" y1="90" x2="28" y2="318" stroke="#0f766e" stroke-width="2" marker-end="url(#arr-down)"/>
  <text class="arrow-label" x="14" y="207" transform="rotate(-90,14,207)">Tighter policy</text>

  <!-- ── Row 1: max_impact_nodes = 500  (13 violations) ───────── -->
  <!-- bar width = (13/147)*480 ≈ 42 -->
  <rect x="182" y="90" width="42" height="42" rx="6" fill="#d1fae5" stroke="#6ee7b7" stroke-width="1.5"/>
  <!-- threshold label -->
  <text class="thresh" x="48" y="116">max: 500</text>
  <!-- violation count inside or beside bar -->
  <text class="bar-text" x="232" y="117">13 violations</text>
  <!-- annotation -->
  <text class="annot" x="678" y="110">All lodash internals</text>
  <line x1="670" y1="111" x2="228" y2="116" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- ── Row 2: max_impact_nodes = 50  (~80 violations) ──────── -->
  <!-- bar width = (80/147)*480 ≈ 261 -->
  <rect x="182" y="154" width="261" height="42" rx="6" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.5"/>
  <text class="thresh" x="48" y="180">max: 50</text>
  <text class="bar-text" x="192" y="181">~80 violations</text>
  <text class="annot" x="678" y="174">Vendor JS + DataTables</text>
  <line x1="670" y1="175" x2="447" y2="180" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- ── Row 3: max_impact_nodes = 15  (113 violations) ─────── -->
  <!-- bar width = (113/147)*480 ≈ 369 -->
  <rect x="182" y="218" width="369" height="42" rx="6" fill="#fed7aa" stroke="#fb923c" stroke-width="1.5"/>
  <text class="thresh" x="48" y="244">max: 15</text>
  <text class="bar-text" x="192" y="245">113 violations</text>
  <text class="annot" x="678" y="235">Java app code appears</text>
  <text class="annot" x="678" y="250">(getInventory, getCatalogItemById)</text>
  <line x1="670" y1="242" x2="555" y2="242" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- ── Row 4: max_impact_nodes = 8  (147+ violations) ─────── -->
  <!-- bar width = 480 (full, 147+) -->
  <rect x="182" y="282" width="480" height="42" rx="6" fill="#fecaca" stroke="#f87171" stroke-width="1.5"/>
  <text class="thresh" x="48" y="308">max: 8</text>
  <text class="bar-text" x="192" y="309">147+ violations</text>
  <text class="annot" x="678" y="299">getShoppingCart (10 nodes)</text>
  <text class="annot" x="678" y="314">now flagged</text>
  <line x1="670" y1="306" x2="666" y2="306" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- ── X-axis tick labels ─────────────────────────────────────── -->
  <line x1="182" y1="334" x2="662" y2="334" stroke="#e2e8f0" stroke-width="1"/>
  <text class="axis-label" x="182" y="348" text-anchor="middle">0</text>
  <text class="axis-label" x="302" y="348" text-anchor="middle">37</text>
  <text class="axis-label" x="422" y="348" text-anchor="middle">74</text>
  <text class="axis-label" x="542" y="348" text-anchor="middle">110</text>
  <text class="axis-label" x="662" y="348" text-anchor="middle">147</text>
  <text class="axis-label" x="422" y="362" text-anchor="middle">violations</text>

  <!-- Tick marks -->
  <line x1="182" y1="334" x2="182" y2="339" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="302" y1="334" x2="302" y2="339" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="422" y1="334" x2="422" y2="339" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="542" y1="334" x2="542" y2="339" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="662" y1="334" x2="662" y2="339" stroke="#cbd5e1" stroke-width="1"/>
</svg>
