<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460" role="img" aria-labelledby="title desc">
  <title id="title">Blast radius: pass vs fail</title>
  <desc id="desc">priceShoppingCart (7 nodes) vs indexOf (648 nodes) at max_impact_nodes: 15 — same policy file, same threshold, structural facts decide pass or fail</desc>

  <defs>
    <style>
      .heading { font: 600 16px ui-sans-serif, system-ui, sans-serif; fill: #0f766e; }
      .label { font: 13px ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .node-label { font: 600 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1e293b; }
      .badge-text { font: 700 12px ui-sans-serif, system-ui, sans-serif; fill: #fff; }
      .impact-text { font: 600 11px ui-sans-serif, system-ui, sans-serif; }
      .summary-text { font: 600 12px ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .subtitle { font: 13px ui-sans-serif, system-ui, sans-serif; fill: #64748b; }
      .panel-label { font: 700 13px ui-sans-serif, system-ui, sans-serif; }
    </style>

    <!-- Green arrow for pass panel -->
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#10b981"/>
    </marker>
    <!-- Red arrow for violated panel -->
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ef4444"/>
    </marker>

    <filter id="soft-shadow">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#00000020"/>
    </filter>
    <filter id="glow-green">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-red">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ── Background ─────────────────────────────────────────────── -->
  <rect width="860" height="460" fill="#f8fafc"/>

  <!-- ── Title area ─────────────────────────────────────────────── -->
  <text class="heading" x="430" y="30" text-anchor="middle">Blast radius: pass vs fail</text>
  <text class="subtitle" x="430" y="50" text-anchor="middle">priceShoppingCart (7 nodes) vs indexOf (648 nodes) at max_impact_nodes: 15</text>

