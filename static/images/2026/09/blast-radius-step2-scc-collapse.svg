<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">Step 2: collapse cycles with SCC condensation</title>
  <desc id="desc">Kosaraju condenses strongly connected components into DAG nodes so cycles do not break reachability</desc>
  <defs>
    <style>
      .step { font: 600 15px ui-sans-serif, system-ui, sans-serif; fill: #0f766e; }
      .label { font: 13px ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .mono { font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1e293b; }
      .box { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; }
      .fn { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .cycle { fill: #fef2f2; stroke: #f87171; stroke-width: 1.8; }
      .scc { fill: #eef2ff; stroke: #818cf8; stroke-width: 2; }
      .arrow { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .edge { stroke: #64748b; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .cycle-edge { stroke: #ef4444; stroke-width: 1.8; fill: none; marker-end: url(#red); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ef4444"/>
    </marker>
  </defs>

  <text class="step" x="48" y="40">Step 2 - Collapse cycles (Kosaraju SCC)</text>

  <!-- before -->
  <rect class="box" x="48" y="68" width="380" height="260" rx="10"/>
  <text class="label" x="68" y="98">Raw call graph (has cycles)</text>

  <circle class="fn" cx="120" cy="200" r="28"/>
  <text class="mono" x="108" y="205">D</text>

  <circle class="cycle" cx="240" cy="148" r="28"/>
  <text class="mono" x="234" y="153">A</text>

  <circle class="cycle" cx="340" cy="200" r="28"/>
  <text class="mono" x="334" y="205">B</text>

  <circle class="cycle" cx="240" cy="252" r="28"/>
  <text class="mono" x="234" y="257">C</text>

  <circle class="fn" cx="380" cy="280" r="28"/>
  <text class="mono" x="372" y="285">E</text>

  <path class="edge" d="M 148 200 L 212 160"/>
  <path class="cycle-edge" d="M 268 148 L 312 178"/>
  <path class="cycle-edge" d="M 340 228 L 268 252"/>
  <path class="cycle-edge" d="M 212 252 L 212 176"/>
  <path class="edge" d="M 368 228 L 352 252"/>

  <text class="label" x="68" y="308" style="font-size:12px">A &lt;-&gt; B &lt;-&gt; C mutual recursion</text>

  <!-- condense arrow -->
  <path class="arrow" d="M 438 198 L 488 198"/>
  <text class="label" x="444" y="182">condense</text>

  <!-- after -->
  <rect class="box" x="508" y="68" width="404" height="260" rx="10"/>
  <text class="label" x="528" y="98">Condensed DAG (acyclic)</text>

  <rect class="scc" x="548" y="148" width="120" height="60" rx="10"/>
  <text class="mono" x="572" y="176">SCC-1</text>
  <text class="label" x="572" y="196" style="font-size:12px">{D}</text>

  <rect class="scc" x="720" y="120" width="150" height="60" rx="10"/>
  <text class="mono" x="744" y="148">SCC-2</text>
  <text class="label" x="744" y="168" style="font-size:12px">{A, B, C}</text>

  <rect class="scc" x="720" y="228" width="120" height="60" rx="10"/>
  <text class="mono" x="744" y="256">SCC-3</text>
  <text class="label" x="744" y="276" style="font-size:12px">{E}</text>

  <path class="edge" d="M 668 178 L 720 150"/>
  <path class="edge" d="M 795 180 L 780 228"/>

  <text class="label" x="528" y="308" style="font-size:12px">7,097 cycles in Kubernetes -&gt; single DAG nodes</text>

  <text class="label" x="48" y="368">Cycles no longer break upstream reachability analysis.</text>
</svg>
