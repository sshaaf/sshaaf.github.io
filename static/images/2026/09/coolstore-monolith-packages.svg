<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" role="img" aria-labelledby="title desc">
  <title id="title">CoolStore monolith package layout</title>
  <desc id="desc">Java EE package structure for the CoolStore monolith</desc>
  <defs>
    <style>
      .root { font: 600 16px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1f2937; }
      .pkg { font: 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #374151; }
      .meta { font: 13px ui-sans-serif, system-ui, sans-serif; fill: #6b7280; }
      .box { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
      .line { stroke: #94a3b8; stroke-width: 1.5; fill: none; }
    </style>
  </defs>
  <rect class="box" x="20" y="20" width="680" height="180" rx="8" ry="8"/>
  <text class="root" x="40" y="52">com.redhat.coolstore/</text>
  <line class="line" x1="40" y1="62" x2="40" y2="178"/>
  <line class="line" x1="40" y1="82" x2="58" y2="82"/><text class="pkg" x="64" y="87">model/</text><text class="meta" x="170" y="87">8 classes - JPA entities and DTOs</text>
  <line class="line" x1="40" y1="104" x2="58" y2="104"/><text class="pkg" x="64" y="109">service/</text><text class="meta" x="170" y="109">9 classes - EJB business logic + MDBs</text>
  <line class="line" x1="40" y1="126" x2="58" y2="126"/><text class="pkg" x="64" y="131">rest/</text><text class="meta" x="170" y="131">4 classes - JAX-RS endpoints</text>
  <line class="line" x1="40" y1="148" x2="58" y2="148"/><text class="pkg" x="64" y="153">persistence/</text><text class="meta" x="170" y="153">1 class - CDI EntityManager producer</text>
  <line class="line" x1="40" y1="170" x2="58" y2="170"/><text class="pkg" x="64" y="175">utils/</text><text class="meta" x="170" y="175">3 classes - logger producer, startup hook, transformers</text>
</svg>
