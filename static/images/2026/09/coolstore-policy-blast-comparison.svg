       ══════════════════════════════════════════════════════════════ -->

  <!-- Panel background -->
  <rect x="12" y="62" width="404" height="354" rx="12" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5" filter="url(#soft-shadow)"/>

  <!-- Panel heading -->
  <text class="panel-label" x="214" y="84" text-anchor="middle" fill="#065f46">priceShoppingCart</text>

  <!-- PASS badge -->
  <rect x="96" y="92" width="90" height="24" rx="12" fill="#10b981"/>
  <text class="badge-text" x="141" y="109" text-anchor="middle">✓ PASS</text>
  <!-- Impact count -->
  <rect x="196" y="92" width="134" height="24" rx="12" fill="#d1fae5" stroke="#10b981" stroke-width="1.2"/>
  <text class="impact-text" x="263" y="109" text-anchor="middle" fill="#065f46">impact: 7 / max: 15</text>

